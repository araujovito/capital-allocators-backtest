# Index Benchmark (metodologia §7) — Japão. MSCI Japan, líquido dos 30%.
# É o índice que o EWJ replica: aqui a diferença é só o produto.
[strategy]
name = "JP Index"
start = "2006-01-01"
end = "2025-12-31"
base_currency = "BRL"
dividends = "reinvest"

[strategy.contribution]
amount = 1000.0
frequency = "monthly"
mode = "real"
inflation_index = "IPCA"
adjustment = "annual"

[strategy.rebalance]
method = "none"
allow_selling = false

[[strategy.weights]]
ticker = "MXJP"
weight = 1.0
