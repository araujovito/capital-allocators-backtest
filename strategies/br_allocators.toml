# Comparação regional Brasil — lado dos capital allocators.
# Itaúsa + Bradespar em pesos iguais.
[strategy]
name = "BR Allocators"
start = "2006-01-01"
end = "2025-12-31"
base_currency = "BRL"
dividends = "reinvest"

[strategy.contribution]
amount = 1000.0
frequency = "monthly"
mode = "real"
inflation_index = "IPCA"
adjustment = "annual"

[strategy.rebalance]
method = "via_contribution"
frequency = "annual"
allow_selling = false

[[strategy.weights]]
ticker = "ITSA4"
weight = 0.5

[[strategy.weights]]
ticker = "BRAP4"
weight = 0.5
