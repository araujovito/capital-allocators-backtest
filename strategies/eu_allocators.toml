# Comparação regional Europa — lado dos capital allocators.
# Investor AB e GBL em pesos iguais, na ótica do investidor brasileiro (BRL).
# Duas moedas distintas do lado europeu: INVE-B liquida em SEK, GBLB em EUR.
[strategy]
name = "EU Allocators"
start = "2006-01-01"
end = "2025-12-31"
base_currency = "BRL"
dividends = "reinvest"

[strategy.contribution]
amount = 1000.0
frequency = "monthly"
mode = "real"
inflation_index = "IPCA"
adjustment = "annual"

[strategy.rebalance]
method = "via_contribution"
frequency = "annual"
allow_selling = false

[[strategy.weights]]
ticker = "INVE-B"
weight = 0.5

[[strategy.weights]]
ticker = "GBLB"
weight = 0.5
