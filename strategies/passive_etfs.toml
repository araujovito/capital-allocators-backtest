# Estratégia principal — gestão passiva.
# Historical Reality: apenas produtos realmente compráveis em 2006.

[strategy]
name = "Passive ETFs"
start = "2006-01-01"
end = "2025-12-31"
base_currency = "BRL"
dividends = "reinvest"

[strategy.contribution]
amount = 1000.0
frequency = "monthly"
mode = "real"
inflation_index = "IPCA"
adjustment = "annual"

[strategy.rebalance]
method = "via_contribution"
frequency = "annual"
allow_selling = false

[[strategy.weights]]
ticker = "PIBB11"
weight = 0.25

[[strategy.weights]]
ticker = "IVV"
weight = 0.25

[[strategy.weights]]
ticker = "IEV"
weight = 0.25

[[strategy.weights]]
ticker = "EWJ"
weight = 0.25
