# Comparação regional Brasil — lado passivo. PIBB11, o único ETF amplo
# realmente comprável no Brasil em 2006.
[strategy]
name = "BR ETF"
start = "2006-01-01"
end = "2025-12-31"
base_currency = "BRL"
dividends = "reinvest"

[strategy.contribution]
amount = 1000.0
frequency = "monthly"
mode = "real"
inflation_index = "IPCA"
adjustment = "annual"

[strategy.rebalance]
method = "none"
allow_selling = false

[[strategy.weights]]
ticker = "PIBB11"
weight = 1.0
