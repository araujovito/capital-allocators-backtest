[package]
name = "backtest-engine"
version = "0.1.0"
edition = "2021"
description = "Motor de backtest determinístico e genérico"

[[bin]]
name = "backtest"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"

[profile.release]
lto = true
codegen-units = 1
