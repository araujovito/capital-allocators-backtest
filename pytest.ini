[pytest]
# O rootdir do pytest e a raiz do repositorio, e nao `python/` — e por isso que
# esta configuracao mora aqui, e nao no pyproject do pacote. Registrada no lugar
# errado, a marca vira PytestUnknownMarkWarning e o filtro do CI nao seleciona nada.
testpaths = tests
markers =
    dados: exige os parquets e resultados de data/, que nao vao para o git
