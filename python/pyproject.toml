[project]
name = "capallo"
version = "0.1.0"
description = "Pipeline de dados e análise: Capital Allocators vs Passive Investing"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "requests>=2.32",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]
# Camada de graficos. Opcional de proposito: o pipeline e o motor nao dependem
# dela, e quem so quer os numeros nao precisa instalar backend de renderizacao.
charts = ["matplotlib>=3.8"]
# Coleta de fontes que renderizam o dado no cliente. Nao e dependencia do
# backtest: instale so quando for coletar.
browser = ["playwright>=1.45"]

[project.scripts]
capallo = "capallo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["../tests"]
